<!doctype html>
<html lang="en">
<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <link rel="stylesheet" href="./css/general.css" />
   <link rel="stylesheet" href="./css/cars.css" />
   <link rel="icon" href="./images/favicon.png" />
   <title>LuxGarage - Cars</title>

   <link rel="preconnect" href="https://fonts.googleapis.com" />
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
   <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap"
      rel="stylesheet"
   />
   <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
   ></script>
   <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
   ></script>
</head>

<body>
   <header>
   <div id="navbar-placeholder"></div>
   <main>
      <section class="cars-section">
         <div class="search-container">
            <input type="text" id="car-search-input" placeholder="Search by brand or model..." class="search-input">
            <ion-icon name="search-outline" class="search-icon-inside"></ion-icon>
         </div>
         <div class="search-buttons">
            <button class="search-button" id="Sedan">Sedan</button>
            <button class="search-button" id="Hatchback">Hatchback</button>
            <button class="search-button" id="Coupe">Coupe</button>
            <button class="search-button" id="Wagon">Wagon</button>
            <button class="search-button" id="Cabriolet">Cabriolet</button>
            <button class="search-button" id="Roadster">Roadster</button>
            <button class="search-button" id="Pickup">Pickup</button>
            <button class="search-button" id="Van">Van</button>
         </div>
         <div id="cars-container">
            <p id="loading-message">Loading...</p>
         </div>
      </section>
   </main>

   <div id="footer-placeholder"></div>
   
   <script type="module" src="js/layout.js"></script>
   <script type="module" src="js/carList.js"></script>
</body>
</html>
