<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | LuxGarage</title>
    <link rel="stylesheet" href="./css/general.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link rel="icon" href="./images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </head>

  <body>
    <div id="navbar-placeholder"></div>

    <main class="screen-section dashboard-section">
      <div class="container dashboard-container">

        <div class="dashboard-header">
          <div>
            <h1 class="dashboard-title">Employee Dashboard</h1>
            <p class="dashboard-subtitle">Manage the fleet, offers and rentals.</p>
          </div>
        </div>

        <div class="tab-nav">
          <button class="tab-btn active" data-panel="panel-vehicles">
            <ion-icon name="car-outline"></ion-icon> Vehicles
          </button>
          <button class="tab-btn" data-panel="panel-offers">
            <ion-icon name="pricetag-outline"></ion-icon> Offers
          </button>
          <button class="tab-btn" data-panel="panel-rentals">
            <ion-icon name="calendar-outline"></ion-icon> Rentals
          </button>
          <button class="tab-btn" id="tab-admin" data-panel="panel-admin" style="display: none;">
            <ion-icon name="shield-checkmark-outline"></ion-icon> Admin
          </button>
        </div>

        <div id="panel-vehicles" class="tab-panel active"></div>
        <div id="panel-offers"   class="tab-panel"></div>
        <div id="panel-rentals"  class="tab-panel"></div>
        <div id="panel-admin"    class="tab-panel"></div>

      </div>
    </main>

    <div id="modals-placeholder"></div>

    <script type="module" src="./js/layout.js"></script>
    <script type="module" src="./js/dashboard/dashboard.js"></script>
  </body>
</html>
