<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" href="./css/general.css" />
      <link rel="stylesheet" href="./css/auth.css" />
      <link rel="icon" href="./images/favicon.png" />

      <title>LuxGarage &mdash; Login</title>

      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap"
         rel="stylesheet"
      />
      <script
         type="module"
         src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
      ></script>
      <script
         nomodule
         src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
      ></script>
   </head>

   <body>
      <div id="navbar-placeholder"></div>
      <main>
         <section class="screen-section">
            <div class="container">
               <div class="auth">
                  <div class="auth-text-box">
                     <div class="text-cont">
                        <h2 class="auth-heading">Concierge Dashboard</h2>
                        <p class="auth-text">
                           Welcome back. Please enter your credentials to manage
                           fleet availability, client requests, and premium
                           reservations.
                        </p>
                     </div>
                     <div id="form-message" class="form-message"></div>
                     <form class="auth-form" id="login-form">
                        <div>
                           <label for="email">Email</label>
                           <input id="email" type="email" placeholder="john.doe@example.com" required />
                        </div>

                        <div>
                           <label for="password">Password</label>
                           <input id="password" type="password" placeholder="••••••••" required />
                        </div>

                        <button type="submit" class="btn btn--form">Log in</button>

                        <span>
                           Are you a new user?
                           <a class="auth-link register-link" href="register.html">Register</a>
                        </span>
                     </form>
                  </div>
                  <div
                     type="img"
                     class="auth-img-box"
                     aria-label="Login Imgage"
                  ></div>
               </div>
            </div>
         </section>
      </main>
      
      <script type="module" src="./js/login.js"></script>
      <script type="module" src="js/layout.js"></script>
   </body>
</html>
